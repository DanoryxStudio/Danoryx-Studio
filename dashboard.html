<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Danoryx Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f8f3ed] text-[#4b352a] p-10">

  <h1 class="text-4xl font-bold mb-10">User Dashboard</h1>

  <div class="bg-white p-6 rounded-2xl shadow space-y-4">

    <p id="name"></p>
    <p id="email"></p>
    <p id="role"></p>
    <p id="id"></p>

    <button
      onclick="logout()"
      class="bg-red-500 text-white px-5 py-2 rounded-full mt-5"
    >
      Logout
    </button>

  </div>

<script>
const user = JSON.parse(localStorage.getItem("danoryx_user"));

if(!user){
  alert("Please login first");
  window.location.href = "login.html";
}

document.getElementById("name").innerText = "Name: " + user.name;
document.getElementById("email").innerText = "Email: " + user.email;
document.getElementById("role").innerText = "Role: " + user.role;
document.getElementById("id").innerText = "User ID: " + user.id;

function logout(){
  localStorage.removeItem("danoryx_login");
  alert("Logged out");
  window.location.href = "login.html";
}
</script>

</body>
</html>
