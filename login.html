<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Danoryx Studio</title>

  <!-- Firebase (ONLY COMPAT) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body{
      font-family: Arial;
      background:#f8f3ed;
      text-align:center;
      padding:50px;
    }

    input{
      padding:12px;
      margin:10px;
      width:250px;
      border-radius:10px;
      border:1px solid #ccc;
    }

    button{
      padding:12px 20px;
      margin:10px;
      border:none;
      border-radius:10px;
      background:#6d5244;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <h1>Danoryx Studio Login</h1>

  <input id="email" type="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>

  <script>
    // ✅ ONLY ONE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyAndku52aqfjlTNJMuw80bZWzRVHFP-dcc",
      authDomain: "donoryx-studio.firebaseapp.com",
      projectId: "donoryx-studio",
      storageBucket: "donoryx-studio.appspot.com",
      messagingSenderId: "373709857804",
      appId: "1:373709857804:web:9efec743f0147923fc3a29"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function signup(){
      auth.createUserWithEmailAndPassword(
        document.getElementById("email").value,
        document.getElementById("password").value
      ).then(() => {
        alert("Account created!");
        window.location.href = "index.html";
      }).catch(err => alert(err.message));
    }

    function login(){
      auth.signInWithEmailAndPassword(
        document.getElementById("email").value,
        document.getElementById("password").value
      ).then(() => {
        alert("Login success!");
        window.location.href = "index.html";
      }).catch(err => alert(err.message));
    }
  </script>

</body>
</html>
