<!-- NAVBAR + CART SYSTEM -->
<nav class="fixed w-full z-50 bg-white/70 backdrop-blur shadow-sm">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

    <!-- BRAND -->
    <h1 class="text-2xl font-bold text-[#5e4638]">
      Danoryx Studio
    </h1>

    <!-- BUTTONS -->
    <div class="flex items-center gap-3">

      <!-- CART -->
      <button
        onclick="openCart()"
        class="bg-[#d8b8a6] text-black px-4 py-2 rounded-full relative"
      >
        🛒 Cart
        <span id="cartCount"
          class="ml-1 bg-red-500 text-white text-xs px-2 py-1 rounded-full">
          0
        </span>
      </button>

      <!-- DASHBOARD -->
      <button
        onclick="window.location.href='dashboard.html'"
        class="bg-[#6d5244] text-white px-4 py-2 rounded-full"
      >
        Dashboard
      </button>

    </div>

  </div>
</nav>

<!-- CART MODAL -->
<div id="cartModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">

  <div class="bg-white w-[90%] md:w-[450px] p-6 rounded-3xl">

    <h2 class="text-2xl font-bold mb-4">Your Cart</h2>

    <div id="cartItems" class="space-y-2"></div>

    <div class="mt-4 font-bold">
      Total: RM <span id="cartTotal">0</span>
    </div>

    <button onclick="checkout()"
      class="mt-6 w-full bg-green-600 text-white py-3 rounded-xl">
      Checkout WhatsApp
    </button>

    <button onclick="closeCart()"
      class="mt-3 w-full bg-gray-300 py-3 rounded-xl">
      Close
    </button>

  </div>

</div>

<!-- CART SCRIPT -->
<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function addToCart(product, price) {
    cart.push({ product, price });

    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();

    alert(product + " added to cart!");
  }

  function updateCartCount() {
    cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById("cartCount").innerText = cart.length;
  }

  function openCart() {
    document.getElementById("cartModal").classList.remove("hidden");
    renderCart();
  }

  function closeCart() {
    document.getElementById("cartModal").classList.add("hidden");
  }

  function renderCart() {
    let html = "";
    let total = 0;

    cart.forEach((item, index) => {
      total += item.price;

      html += 
        <div class="flex justify-between border-b py-2">
          <span>${item.product}</span>
          <span>RM${item.price}</span>
        </div>
      ;
    });

    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("cartTotal").innerText = total;
  }

  function checkout() {
    let msg = "Hello Danoryx Studio, saya ingin membuat order.\n\n";

    cart.forEach(item => {
      msg += ${item.product} - RM${item.price}\n;
    });

    let total = cart.reduce((sum, i) => sum + i.price, 0);

    msg += \nTotal: RM${total};

    let url = "https://wa.me/601170720910?text=" + encodeURIComponent(msg);

    window.open(url, "_blank");
  }

  updateCartCount();
</script>
