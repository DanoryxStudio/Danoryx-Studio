<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Danoryx Studio</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f8f3ed] p-6">

<!-- HEADER -->
<div class="bg-black text-white p-4 flex justify-between items-center rounded-xl">

  <h1 class="font-bold text-lg">ADMIN PANEL - Danoryx Studio</h1>

  <button onclick="logout()"
    class="bg-white text-black px-4 py-1 rounded-full">
    Logout
  </button>

</div>

<!-- USERS -->
<h2 class="text-2xl font-bold mt-6">Users</h2>
<div id="userList" class="space-y-3 mt-3"></div>

<!-- ORDERS -->
<h2 class="text-2xl font-bold mt-10">Orders</h2>
<div id="orderList" class="space-y-3 mt-3"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAndku52aqfjlTNJMuw80bZWzRVHFP-dcc",
  authDomain: "donoryx-studio.firebaseapp.com",
  projectId: "donoryx-studio",
  storageBucket: "donoryx-studio.appspot.com",
  messagingSenderId: "373709857804",
  appId: "1:373709857804:web:9efec743f0147923fc3a29"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* ---------------- USERS ---------------- */

async function loadUsers(){

  let snap = await db.collection("users").get();

  let html = "";

  snap.forEach(doc => {

    let u = doc.data();

    html += 
      <div class="bg-white p-4 rounded-xl shadow">

        <p class="font-bold">${u.email || "-"}</p>
        <p class="text-sm text-gray-500">${u.userId || "-"}</p>
        <p>Role: ${u.role || "-"}</p>

        <button onclick="makeAgent('${doc.id}')"
          class="mt-3 bg-green-600 text-white px-4 py-2 rounded-xl">
          Make Agent
        </button>

      </div>
    ;
  });

  document.getElementById("userList").innerHTML = html || "<p>No users</p>";
}

async function makeAgent(id){

  await db.collection("users").doc(id).update({
    role: "agent"
  });

  alert("User upgraded to agent!");
  loadUsers();
}

/* ---------------- ORDERS ---------------- */

async function loadOrders(){

  let snapshot = await db.collection("orders").get();

  let html = "";

  snapshot.forEach(doc => {

    let order = doc.data();

    let total = order.total || 0;
    let userId = order.userId || "";

    html += 
      <div class="bg-white p-4 rounded-xl shadow">

        <p class="font-bold">Order ID:</p>
        <p class="text-sm text-gray-500 mb-2">${doc.id}</p>

        <p>Total: RM${total}</p>

        <p>Status:
          <span class="text-orange-500">
            ${order.status || "pending"}
          </span>
        </p>

        <button
          onclick="completeOrder('${doc.id}','${userId}',${total})"
          class="mt-4 bg-green-600 text-white px-4 py-2 rounded-xl">
          Complete Order
        </button>

      </div>
    ;
  });

  document.getElementById("orderList").innerHTML = html || "<p>No orders</p>";
}

/* COMPLETE ORDER */

async function completeOrder(orderId, userId, total){

  try {

    await db.collection("orders").doc(orderId).update({
      status: "completed"
    });

    if(userId){

      let ref = db.collection("users").doc(userId);
      let doc = await ref.get();

      if(doc.exists){

        let data = doc.data();

        let newSales = (data.totalSales || 0) + total;
        let newPoints = (data.points || 0) + Math.floor(total / 10);

        await ref.update({
          totalSales: newSales,
          points: newPoints
        });
      }
    }

    alert("Order completed!");

    loadOrders();

  } catch (e) {
    alert("Error: " + e.message);
  }
}

/* ---------------- LOGOUT ---------------- */

function logout(){
  auth.signOut().then(() => {
    window.location.href = "login.html";
  });
}

/* INIT */

loadUsers();
loadOrders();

</script>

</body>
</html>
