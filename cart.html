<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart - Danoryx Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f8f3ed] text-[#4b352a] p-10">

  <h1 class="text-3xl font-bold mb-6">Your Cart</h1>

<div id="cartItems" class="space-y-4"></div>

<h2 class="text-2xl font-bold mt-6" id="totalPrice">Total: RM0</h2>

<button onclick="checkout()" class="mt-4 bg-[#6d5244] text-white px-6 py-3 rounded-full">
  Checkout WhatsApp
</button>

  <h1 class="text-4xl font-bold mb-10">Your Cart</h1>

  <div id="cartBox" class="space-y-4"></div>

  <div class="mt-10">
    <h2 id="total" class="text-2xl font-bold"></h2>

    <button
      onclick="goCheckout()"
      class="mt-6 bg-[#6d5244] text-white px-6 py-3 rounded-full"
    >
      Proceed Checkout
    </button>
  </div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let box = document.getElementById("cartBox");
let total = 0;

function renderCart(){

  box.innerHTML = "";
  total = 0;

  cart.forEach((item, index)=>{
    box.innerHTML += 
      <div class="bg-white p-5 rounded-2xl shadow flex justify-between">
        <span>${item.name}</span>
        <span>RM${item.price}</span>
      </div>
    ;

    total += item.price;
  });

  document.getElementById("total").innerText =
  "Total: RM" + total;
}

renderCart();

function goCheckout(){
  window.location.href = "checkout.html";
}

  <script>
function loadCart() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let container = document.getElementById("cartItems");
  let total = 0;

  container.innerHTML = "";

  cart.forEach((item, index) => {
    total += item.price;

    container.innerHTML += 
      <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
        <div>
          <h3 class="font-bold">${item.product}</h3>
          <p>RM${item.price}</p>
        </div>
        <button onclick="removeItem(${index})" class="text-red-500">Remove</button>
      </div>
    ;
  });

  document.getElementById("totalPrice").innerText = "Total: RM" + total;
}

function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

function checkout() {
function checkout() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  if(cart.length === 0){
    alert("Cart kosong");
    return;
  }

  let name = prompt("Nama anda:");
  let phone = prompt("No phone:");

  let message = "🛍️ Hello Danoryx Studio\n\n";
  message += "Nama: " + name + "\n";
  message += "Phone: " + phone + "\n\n";
  message += "Order:\n";

  let total = 0;

  cart.forEach(item => {
    message += "- " + item.product + " RM" + item.price + "\n";
    total += item.price;
  });

  message += "\nTotal: RM" + total;
  message += "\n\nTerima kasih!";

  let url = "https://wa.me/601170720910?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}

loadCart();
</script>
</script>

</body>
</html>
