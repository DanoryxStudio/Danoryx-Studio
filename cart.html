<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Danoryx Studio</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      font-family: Poppins, sans-serif;
      background:#f8f3ed;
      color:#4b352a;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="bg-[#6d5244] text-white p-5 text-center text-2xl font-bold">
  Your Cart
</div>

<!-- CART LIST -->
<div class="max-w-3xl mx-auto p-6">

  <div id="cartItems" class="space-y-4"></div>

  <!-- TOTAL -->
  <div class="mt-8 bg-white p-6 rounded-2xl shadow">

    <h2 class="text-xl font-bold">
      Total: RM <span id="totalPrice">0</span>
    </h2>

    <button onclick="checkout()"
      class="mt-5 w-full bg-green-600 text-white py-3 rounded-xl">
      Checkout WhatsApp
    </button>

  </div>

</div>

<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function renderCart() {
    let container = document.getElementById("cartItems");
    let total = 0;

    container.innerHTML = "";

    if(cart.length === 0){
      container.innerHTML = "<p class='text-center text-gray-500'>Cart kosong</p>";
      document.getElementById("totalPrice").innerText = 0;
      return;
    }

    cart.forEach((item, index) => {

      total += item.price;

      container.innerHTML += 
        <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
          
          <div>
            <h3 class="font-bold">${item.product}</h3>
            <p>RM${item.price}</p>
          </div>

          <button onclick="removeItem(${index})"
            class="bg-red-500 text-white px-3 py-1 rounded-lg">
            Remove
          </button>

        </div>
      ;
    });

    document.getElementById("totalPrice").innerText = total;
  }

  function removeItem(index){
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  function checkout(){

    if(cart.length === 0){
      alert("Cart kosong!");
      return;
    }

    let name = prompt("Nama anda:");
    let phone = prompt("No phone:");

    let message = "🛍️ Order Danoryx Studio\n\n";
    message += "Nama: " + name + "\n";
    message += "Phone: " + phone + "\n\n";
    message += "Order:\n";

    let total = 0;

    cart.forEach(item => {
      message += "- " + item.product + " RM" + item.price + "\n";
      total += item.price;
    });

    message += "\nTotal: RM" + total;
    message += "\n\nTerima kasih ❤️";

    let url = "https://wa.me/601170720910?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
  }

  renderCart();
</script>

</body>
</html>
